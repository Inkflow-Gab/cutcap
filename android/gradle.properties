# Memory for the Gradle daemon. CI runners have more than a phone, and R8 likes room.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Parallel module builds and a build cache: the second APK build is much faster than the first.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

android.useAndroidX=true
# Keep the R class small and the dex count down.
android.nonTransitiveRClass=true
android.enableJetifier=false

# R8 in full mode is faster at runtime; the web layer needs nothing special from ProGuard.
android.r8.fullMode=true
