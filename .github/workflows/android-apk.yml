# Builds the Android APK. Manual and on every push that touches the Android layer, so the
# web bundle, the Java plugin and the Gradle config are all proven together, not one at a time.
name: android

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "scripts/build-android.mjs"
      - "scripts/make-android-icons.mjs"
      - "scripts/java-check/**"
      - "src/**"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "scripts/build-android.mjs"
      - "src/**"
      - "package.json"
      - "vite.config.ts"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Electron and ffmpeg are desktop-only; skipping them cuts install time and disk.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      OPENROLL_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Version name
        run: echo "OPENROLL_VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Web bundle
        run: npm run android:web

      - name: Capacitor sync
        run: npx cap sync android

      - name: Debug APK
        run: |
          cd android
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode=summary 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Logs are only readable in the UI; annotations come back through the API too, which
            # is what an agent iterating on this workflow can see.
            grep -nE "^(e: |.*error:|What went wrong|Caused by|> Task .*FAILED|FAILURE:)" "$RUNNER_TEMP/gradle.log" \
              | head -25 | while IFS= read -r line; do echo "::error ::$line"; done
          fi
          exit "$status"

      - name: Release APK
        env:
          OPENROLL_KEYSTORE: ${{ github.workspace }}/release.keystore
          OPENROLL_KEYSTORE_PASSWORD: ${{ secrets.OPENROLL_KEYSTORE_PASSWORD }}
          OPENROLL_KEY_ALIAS: ${{ secrets.OPENROLL_KEY_ALIAS }}
          OPENROLL_KEY_PASSWORD: ${{ secrets.OPENROLL_KEY_PASSWORD }}
        run: |
          if [ -n "$OPENROLL_KEYSTORE_PASSWORD" ]; then
            echo "${{ secrets.OPENROLL_KEYSTORE_BASE64 }}" | base64 -d > "$OPENROLL_KEYSTORE"
          fi
          cd android
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-release.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -nE "^(e: |.*error:|What went wrong|Caused by|> Task .*FAILED|FAILURE:)" "$RUNNER_TEMP/gradle-release.log" \
              | head -25 | while IFS= read -r line; do echo "::error ::$line"; done
          fi
          exit "$status"

      - name: Collect APKs
        run: |
          mkdir -p apk
          find android/app/build/outputs/apk -name '*.apk' -exec sh -c 'cp "$1" "apk/openroll-$(basename "$(dirname "$(dirname "$1")")")-$(basename "$1")"' _ {} \;
          ls -la apk

      - uses: actions/upload-artifact@v4
        with:
          name: openroll-apk
          path: apk/*.apk
          retention-days: 30
          if-no-files-found: error
